<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
<center>
<form>
<table border="1" cellpadding="8">
<tr><th colspan="4"><h2>Registration Form</h2></th></tr>
<tr>
    <td>Student Name</td>
    <td><input type="text" placeholder="First Name"></td>
    <td><input type="text" placeholder="Middle Name"></td>
    <td><input type="text" placeholder="Last Name"></td>
</tr>
<tr>
    <td>Father's Name</td>
    <td><input type="text"></td>
    <td>Mother's Name</td>
    <td><input type="text"></td>
</tr><tr>
    <td>Date of Birth</td>
    <td><input type="date"></td>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
    </td>
</tr>
<tr>
    <td>Category</td>
    <td>
        <input type="radio" name="cat">Gen
        <input type="radio" name="cat">OBC
        <input type="radio" name="cat">SC/ST
    </td>
    <td>Handicapped</td>
    <td>
        <input type="radio" name="hand">Yes
        <input type="radio" name="hand">No
    </td>
</tr>
<tr>
    <td>Ex-Serviceman</td>
    <td>
        <input type="radio" name="ex">Yes
        <input type="radio" name="ex">No
    </td>
    <td>EWS</td>
    <td>
        <input type="radio" name="ews">Yes
        <input type="radio" name="ews">No
    </td>
</tr>
<tr>
    <td>Email ID</td>
    <td><input type="email"></td>
    <td>Mobile No.</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>State</td>
    <td>
        <select>
            <option>Select</option>
            <option>Telangana</option>
            <option>Andhra Pradesh</option>
        </select>
    </td>
    <td>City</td>
    <td>
        <select>
            <option>Select</option>
            <option>Hyderabad</option>
            <option>Warangal</option>
        </select>
    </td>
</tr>
<tr>
    <td>Upload Photo</td>
    <td><input type="file"></td>
    <td>Upload Signature</td>
    <td><input type="file"></td>
</tr>
<tr>
    <td colspan="4" align="center">
        <input type="submit" value="Submit">
    </td>
</tr>
</table>
</form>
</center>
</body>
</html>
